{% extends 'eventos/base.html' %}

{% block content %}
<h2 class="mb-4">Lista de Eventos</h2>

<a href="{% url 'crear_evento' %}" class="btn btn-primary mb-3">Crear Evento</a>
<a href="{% url 'registrar_evento' %}" class="btn btn-success mb-3">Registrarse</a>

<table class="table table-striped table-bordered">
    <thead class="table-dark">
        <tr>
            <th>Nombre</th>
            <th>Fecha</th>
            <th>Lugar</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
    {% for evento in eventos %}
        <tr>
            <td>{{ evento.nombre }}</td>
            <td>{{ evento.fecha }}</td>
            <td>{{ evento.lugar }}</td>
            <td>
                <a href="{% url 'detalle_evento' evento.id %}" class="btn btn-info btn-sm">Ver</a>
                <a href="{% url 'editar_evento' evento.id %}" class="btn btn-warning btn-sm">Editar</a>
                <a href="{% url 'eliminar_evento' evento.id %}" 
                    class="btn btn-danger btn-sm"
                    onclick="return confirm('¿Estás seguro de eliminar este evento?');">
                    Eliminar
                </a>
            </td>
        </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
